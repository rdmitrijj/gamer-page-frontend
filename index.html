<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link href="style.css" rel="stylesheet">
  <title>Gamer sign-up form</title>
</head>
<body>

  <!-- Brand column starts -->

  <!-- NEONCORE logo -->
<main>
  <div class="left-container">
    <section class="main-heading">
      <img src="assets/images/logo.svg">
    <h1><span class="highlight">// </span> Join the nexus</h1>
    <p class="hint-text">Initialize your NEONCORE identity</p>
    </section>


    <!-- Dynamic: ready count, then "Provisioned" after success -->
  <!-- Operator ID readout (on tablet and mobile it becomes a one-line strip: Operator ID + callsign) -->
    <section>
      <p class="under-main-header"><span>Operator ID</span> <span>0/5 ready</span></p>
      <!-- Dynamic: "Unassigned" until the callsign is valid, then the callsign -->
      <h2>Unassigned</h2>
      <dl>
        <dt>Callsign</dt>
        <dd>Pending</dd>

        <dt>Email</dt>
        <dd>Pending</dd>

        <dt>Password</dt>
        <dd>Pending</dd>

        <dt>Confirm</dt>
        <dd>Pending</dd>

        <dt>Terms</dt>
        <dd>Pending</dd>
      </dl>
    </section>
    
  <!-- Dynamic: row statuses -->
  <!-- Pending
  Required
  OK
  Locked -->


  <!-- Dynamic: fault codes shown on a row when its field has an error -->
  <!-- Missing
  Too short
  Too long
  Bad character
  Malformed
  Mismatch -->
  </div>
  <!-- Brand column ends -->

  <!-- Sign-up form starts -->
  <div class="right-container">
    <form>
      <div class="form-header">
      <h2>New operator</h2><h2><span class="darker-light">All fields required</span></h2>
    </div>
    <label>
      <span>
        <h3><span class="highlight">></span> Callsign</h3>
      </span>
    <input class="inline-input" placeholder="e.g. Vortex_07">
    <span class="hint-text">3–20 characters: letters, numbers, _ or -</span>
    </label>
    <!-- Enter a callsign
    Use at least 3 characters
    Use 20 characters or fewer
    Use letters, numbers, _ or - only --->

    <label>
      <span>
        <h3><span class="highlight">></span> Email</h3>
      </span>
    <input class="inline-input" placeholder="you@example.com">
    </label>
    <!-- Enter your email
    Enter a valid email, like you@example.com -->

    <label>
      <span>
        <h3><span class="highlight">></span> Password</h3>
      </span>
      <input class="inline-input" id="password" type="password">
      <span class="hint-text">At least 8 characters</span>
    </label> 
    <!-- Show / hide password button -->
    <!-- Dynamic: password strength -->
    <!-- Weak
    Fair
    Good
    Strong
    Enter a password
    Use at least 8 characters -->

     <label>
      <span>
        <h3><span class="highlight">></span> Confirm password</h3>
      </span>
      <div class="pass-wrapper">
        <input class="inline-input" id="password" type="text"><button type="button" class="password-eye"></button>
      </div>
    </label>
    <!-- Show / hide password button -->
    <!-- Confirm your password
    Passwords don't match -->
    <div class="form-footer">
    <label class="cbox-block">
      <input class="checkbox" type="checkbox">
      <h3>I accept the <a href="">Terms</a> and <a href="">Privacy Policy</a>.</h3>
    <!-- Accept the terms to continue -->
    </label>
    <label>
      <button class="submit-button" type="submit">Initialize account</button>
    </label>

    <!-- Loading -->
    <!-- Transmitting_ -->
    <h3>Already an operator? <a href="">Log in</a></h3>
    </div>
    <!-- Sign-up form ends -->

    <!-- Success view starts -->

    <!-- // Handshake complete
    Operator [callsign] provisioned. Your account is ready.
    Continue to log in -->
    </form>
  </div>
</main>
  <!-- Success view ends -->
  <script src="main.js" defer></script>
</body>
</html>
